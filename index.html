<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shopping-cart">
    <h1>Shopping Cart</h1>

    <div class="item">
      <img src="https://via.placeholder.com/80x80?text=Shoes" alt="Baskets">
      <div class="description">
        <span>Baskets</span>
        <span>Running shoes</span>
      </div>
      <div class="quantity-box">
        <i class="fas fa-minus-circle"></i>
        <span class="quantity">1</span>
        <i class="fas fa-plus-circle"></i>
      </div>
      <div class="unit-price">100 $</div>
      <div class="item-total">100 $</div>
      <div class="buttons">
        <i class="fas fa-trash-alt"></i>
        <i class="fas fa-heart"></i>
      </div>
    </div>

    <div class="item">
      <img src="https://via.placeholder.com/80x80?text=Socks" alt="Socks">
      <div class="description">
        <span>Socks</span>
        <span>Cotton socks</span>
      </div>
      <div class="quantity-box">
        <i class="fas fa-minus-circle"></i>
        <span class="quantity">2</span>
        <i class="fas fa-plus-circle"></i>
      </div>
      <div class="unit-price">20 $</div>
      <div class="item-total">40 $</div>
      <div class="buttons">
        <i class="fas fa-trash-alt"></i>
        <i class="fas fa-heart"></i>
      </div>
    </div>

    <div class="item">
      <img src="https://via.placeholder.com/80x80?text=Bag" alt="Bag">
      <div class="description">
        <span>Bag</span>
        <span>Leather bag</span>
      </div>
      <div class="quantity-box">
        <i class="fas fa-minus-circle"></i>
        <span class="quantity">1</span>
        <i class="fas fa-plus-circle"></i>
      </div>
      <div class="unit-price">50 $</div>
      <div class="item-total">50 $</div>
      <div class="buttons">
        <i class="fas fa-trash-alt"></i>
        <i class="fas fa-heart"></i>
      </div>
    </div>

    <div class="cart-total">Total: <span class="total">0 $</span></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
